# gitleaks' default rules, with three false positives allowed. Each was read by hand on 2026-11-19.
[extend]
useDefault = true

[allowlist]
description = "Public values the generic-api-key rule mistakes for secrets"
regexes = [
  # A contract address (20 bytes) in contracts/deployments/*.json: public on Sepolia. A private key is 32 bytes.
  '''^0x[0-9a-fA-F]{40}$''',
  # The name of an encryption scheme in contracts/test/unit/Base.sol and Vectors.t.sol.
  '''^x25519-xsalsa20poly1305$''',
  # base64 of the text "sealed-key-for-buyer", a test value in the same two files.
  '''^c2VhbGVkLWtleS1mb3ItYnV5ZXI$''',
]
